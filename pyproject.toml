[project]
name = "claude-seo-unified"
version = "1.2.0"
description = "Autonomous multi-agent website optimiser for Claude Code"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Jishnu"}
]
keywords = ["seo", "claude-code", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/jishhnnuu/seo-aeo-geo"
Repository = "https://github.com/jishhnnuu/seo-aeo-geo"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
