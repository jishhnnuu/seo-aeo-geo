# Autonomous SEO/AEO/GEO growth loop for this website.
#
# Runs the claude-seo-unified plugin (planner -> audit -> fix/content ->
# test -> publish -> distribute) on a schedule, using YOUR Claude
# subscription (via CLAUDE_CODE_OAUTH_TOKEN) rather than a separate,
# pay-per-token API key. See docs/GROWTH-LOOP.md for the full setup guide.
#
# BEFORE FIRST RUN:
#   1. Fill in seo-config.yml at the repo root.
#   2. Set the secrets listed under "env:" below. Every one is optional
#      except the two marked REQUIRED: the loop degrades to weaker data
#      rather than failing when a credential is absent.
#
#      REQUIRED:
#        CLAUDE_CODE_OAUTH_TOKEN  - from `/install-github-app` in Claude Code.
#        GROWTH_LOOP_PAT          - see "Why a PAT is required" below.
#
#      On a GitHub *organization*, the shared ones (CLAUDE_CODE_OAUTH_TOKEN,
#      GROWTH_LOOP_PAT, GOOGLE_API_KEY, GOOGLE_APPLICATION_CREDENTIALS_JSON,
#      MOZ_API_KEY, BING_WEBMASTER_API_KEY) can be organization secrets that
#      every site repo inherits. On a *personal* account there is no such
#      thing as an account-level Actions secret, so set them per repo.
#      (Organization secrets on PRIVATE repos additionally need a Team plan;
#      on public repos they work on Free.)
#   3. If your host checks Git contributors before building (Netlify does),
#      confirm the committer identity below is one it recognises. A host that
#      refuses to build is the worst failure mode this loop has: every job
#      reports success and the live site never changes.
#   4. Turn on branch protection on your deploy branch requiring the
#      "test-and-publish" status check to pass before merge
#      (belt-and-suspenders alongside seo-publisher's own precondition).
#
# ---------------------------------------------------------------------------
# WHY A PAT IS REQUIRED (do not skip this)
#
# GitHub deliberately does not start a workflow run from an event created
# with the built-in GITHUB_TOKEN -- it is how they prevent workflows from
# triggering themselves forever. The "build" job below opens a pull request,
# and "test-and-publish" runs `on: pull_request`. If the PR is opened with
# GITHUB_TOKEN, that second job NEVER RUNS: the PR sits open, nothing tests
# it, nothing merges it, and the loop silently stalls every cycle while
# appearing to work.
#
# So: create a fine-grained personal access token scoped to THIS repository
# with Contents: read/write, Pull requests: read/write, Issues: read/write,
# and save it as the GROWTH_LOOP_PAT secret. The jobs below fall back to
# GITHUB_TOKEN if it is absent, which keeps the audit jobs working but
# leaves publishing stalled -- the plan-and-audit job reports this.
#
# DEPLOYMENT: merging is not the same as deploying. Vercel, Netlify,
# Cloudflare Pages and similar hosts deploy from their own webhooks, which
# fire normally on any push. But if THIS repo deploys via another GitHub
# Actions workflow (GitHub Pages, a custom deploy.yml), that workflow is
# subject to the same restriction above -- it needs the PAT too, or it will
# not fire on the merge.
#
# COST: Actions minutes are unlimited on public repos but metered on private
# ones (2,000/month on Free, 3,000 on Pro). This loop runs six agent jobs a
# week (1 audit, 2 build, 2 distribute, 1 report); distribution used to run
# daily, which was four extra agent runs a week for a job that only pings
# IndexNow and checks indexing. Every job below sets timeout-minutes so one hung run cannot
# eat the month; watch Settings -> Billing for the first few weeks.
#
# KEEPING THE SCHEDULE ALIVE: GitHub disables scheduled workflows in a repo
# with no activity for 60 days. This loop commits to reports/ weekly, which
# counts as activity, so it sustains itself as long as it is running.
# ---------------------------------------------------------------------------

name: SEO Growth Loop

on:
  schedule:
    - cron: "0 6 * * 1"        # plan + full audit: Monday 06:00 UTC
    - cron: "0 6 * * 2,4"      # fix + content build: Tuesday & Thursday 06:00 UTC
    - cron: "0 7 * * 1,4"      # distribution + indexing check: Mon & Thu 07:00 UTC
    - cron: "0 9 * * 1"        # weekly report: Monday 09:00 UTC, after the audit lands
  pull_request:
    # NOTE: on.pull_request.branches filters the BASE branch. The build job
    # opens its PR FROM seo/** INTO the deploy branch, so filtering on
    # seo/** here would match nothing and test-and-publish would never run,
    # stalling the loop silently. Head-branch filtering is not available at
    # trigger level, so it is done in the test-and-publish job's `if` below.
    types: [opened, synchronize, reopened]
  workflow_dispatch:           # lets you trigger one job manually from the Actions tab
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: plan-and-audit
        type: choice
        options: [plan-and-audit, build, distribute, report]

# Serialize runs that commit to the default branch, so the Monday audit and
# the daily distribute job can never race each other into a push conflict.
# PR runs get their own group so testing is never blocked by an audit.
concurrency:
  group: >-
    seo-growth-loop-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number) || 'default-branch' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Every bundled script in the plugin reads its credentials from these exact
# environment variables (with a config-file fallback we don't need on an
# ephemeral runner). Declared once at workflow level so all four jobs
# inherit them — nothing is written to disk.
env:
  # --- SHARED across all your sites: set as ORGANIZATION secrets ---
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}                                    # Tier 0: PageSpeed Insights, CrUX, CrUX History
  GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}  # Tier 1: Search Console + Indexing API (paste the service-account JSON inline)
  MOZ_API_KEY: ${{ secrets.MOZ_API_KEY }}                                          # free-tier backlink data
  BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}                    # Bing Webmaster Tools
  # --- PER-SITE: set as secrets on THIS repo ---
  GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}                                        # e.g. sc-domain:example.com
  GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}                                  # Tier 2: GA4 organic traffic
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}                                        # per-site host key
  INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}                      # optional, if the key file isn't at the site root
  # --- PER-SITE CMS credentials: only the ones your platform needs ---
  WP_APP_USER: ${{ secrets.WP_APP_USER }}
  WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
  SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
  WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
  # --- OPTIONAL: real email delivery of the weekly report. Without these the
  #     report still reaches you, as a comment on a pinned GitHub issue, which
  #     GitHub emails to you. Set them only if you want a formatted inbox copy.
  #     For Gmail, SMTP_PASSWORD must be an App Password, never the account
  #     password: https://myaccount.google.com/apppasswords ---
  REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
  # `secrets` is not an available context inside a step-level `if`, but `env` is,
  # so the presence test has to be computed here rather than at the step.
  HAS_SMTP: ${{ secrets.SMTP_USERNAME != '' && secrets.REPORT_EMAIL_TO != '' }}
  # --- WHO THE COMMITS COME FROM ---
  # git reads these four directly, so setting them once here applies to every
  # job and to every git call an agent makes, without a config step per job.
  #
  # This matters more than it looks. Netlify, Vercel and similar hosts check the
  # *committer identity* before they will build: Netlify calls an unrecognised
  # one an "Unrecognized Git contributor" and the deploy sits pending approval,
  # so the loop reports success while the live site never changes. The default
  # here is the repository owner's GitHub noreply address, which is tied to
  # their account and therefore recognised.
  #
  # If your host still refuses to build, set GIT_COMMITTER_EMAIL as a repository
  # secret to the email address on your Git account. That is nearly always
  # cheaper than adding a bot to the host's contributor list, which on some
  # plans consumes a paid contributor seat.
  GIT_AUTHOR_NAME: ${{ secrets.GIT_COMMITTER_NAME || 'SEO Growth Loop' }}
  GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME || 'SEO Growth Loop' }}
  GIT_AUTHOR_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}
  GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL || format('{0}@users.noreply.github.com', github.repository_owner) }}
  # --- lets the agents use the `gh` CLI (issue sync, PR creation) ---
  # Prefer the PAT: a pull request opened with the built-in GITHUB_TOKEN does
  # not trigger the `on: pull_request` test-and-publish job. See the header.
  GH_TOKEN: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
  HAS_GROWTH_LOOP_PAT: ${{ secrets.GROWTH_LOOP_PAT != '' }}

jobs:
  # ---- Runs first on every trigger. Proves the setup still works before any
  #      other job spends 45 minutes and your Actions minutes on it. ----
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}

      - name: Fetch the preflight checker
        # preflight is a plain `run:` step against THIS repo's checkout, but the
        # script ships with the plugin, which only exists inside the
        # claude-code-action steps. Pull it from the engine repo, pinned to the
        # same release the plugin is pinned to, so the gate cannot drift from
        # the agents it gates.
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/preflight_check.py" \
            https://raw.githubusercontent.com/jishhnnuu/seo-aeo-geo/v1.7.0/scripts/preflight_check.py

      - name: Prove every credential with a real call
        id: check
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          MOZ_API_KEY: ${{ secrets.MOZ_API_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          HAS_PAT: ${{ secrets.GROWTH_LOOP_PAT != '' }}
          # inherited from workflow env, named here so the check reads them
          GIT_COMMITTER_NAME: ${{ env.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ env.GIT_COMMITTER_EMAIL }}
        run: |
          set -uo pipefail
          python3 -m pip install --quiet pyyaml google-auth google-api-python-client 2>/dev/null || true
          python3 "${RUNNER_TEMP}/preflight_check.py" --github-summary >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail loudly if the loop cannot do its job at all
        env:
          HAS_PAT: ${{ secrets.GROWTH_LOOP_PAT != '' }}
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/preflight_check.py" --gate

  # ---- Monday: strategy + full audit. Writes reports/ only, no site changes. ----
  plan-and-audit:
    needs: preflight
    if: github.event.schedule == '0 6 * * 1' || inputs.job == 'plan-and-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
      - name: Install the plugin's Python runtime
        # The plugin's bundled scripts are what an audit actually runs, and they
        # need their dependencies present. claude-code-action installs the
        # plugin's files but not a Python environment for them, and a fresh
        # runner has neither, so every `claude-seo run ...` call fails and the
        # agent burns its turns discovering that. Install the pinned release's
        # requirements up front, and make the scripts importable directly so a
        # missing launcher shim is not fatal.
        run: |
          set -uo pipefail
          TAG="v1.6.0"
          curl -fsSL -o "${RUNNER_TEMP}/requirements.txt" \
            "https://raw.githubusercontent.com/jishhnnuu/seo-aeo-geo/${TAG}/requirements.txt" || true
          if [ -s "${RUNNER_TEMP}/requirements.txt" ]; then
            python3 -m pip install --quiet -r "${RUNNER_TEMP}/requirements.txt" \
              || echo "::warning::Some plugin dependencies failed to install. The audit will degrade to whatever still works rather than stopping."
          else
            echo "::warning::Could not fetch the plugin requirements for ${TAG}. Bundled scripts may be unavailable this run."
          fi

      - name: Normalise the Claude token
        # A secret pasted with a stray leading or trailing space malforms the
        # auth header. It fails in the least readable way possible: no auth
        # error, the action installs and initialises fine, then returns
        # is_error with zero cost and no model call. GitHub masks the token
        # itself but not the surrounding whitespace, so the giveaway is a value
        # rendering as " ***" in the action's input dump.
        #
        # Trim it, re-register the trimmed value as masked BEFORE it is used so
        # it can never surface in a log, and say loudly if trimming changed
        # anything so the secret gets fixed at source rather than papered over.
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          TRIMMED="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          echo "::add-mask::$TRIMMED"
          echo "CLAUDE_TOKEN=$TRIMMED" >> "$GITHUB_ENV"
          if [ "${#TRIMMED}" -ne "${#RAW}" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN contained $(( ${#RAW} - ${#TRIMMED} )) whitespace character(s), which have been stripped for this run. Re-paste the secret without them: Settings, Secrets and variables, Actions."
          fi
          if [ -z "$TRIMMED" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or whitespace only."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          plugin_marketplaces: "https://github.com/jishhnnuu/seo-aeo-geo.git"
          plugins: "claude-seo-unified@jishnu-seo-aeo-geo"
          prompt: >
            THIS IS A ONE-SHOT, NON-INTERACTIVE RUN. There is no later turn: when
            this job's steps finish, the container is gone. If you invoke a
            subagent, you must wait for it to actually complete and its files
            to actually exist on disk BEFORE you end your turn. Never launch a
            subagent asynchronously and end your turn assuming you will be
            "notified when it finishes" or resumed afterward. That behaviour is
            for an interactive session; here it means the subagent runs into
            the void and nothing after it ever executes. If your subagent tool
            offers a background or async mode, do not use it in this workflow.
            Confirm completion the same way a human would: check that the
            files the subagent was supposed to write are actually present with
            Read or ls before moving on or finishing.
            TOKEN BUDGET. Every run here costs the owner's subscription.
            Read only the files you actually need, and read a slice rather
            than a whole file where a slice answers the question. Do not
            re-read a file you have already read this run. Prefer grep over
            opening files to search. Do not restate your plan or narrate
            progress. Keep every report you write under 400 words. Do not
            take on work beyond what this job asks for.
            Being frugal never means finishing early. This job is complete
            only when every file named under DEFINITION OF DONE exists and is
            committed. If you find yourself concluding with nothing written,
            that is not a cheap run, it is a failed one: hand the reason to
            seo-resolver and let it work the problem.

            First: if the environment variable HAS_GROWTH_LOOP_PAT is not
            "true", the GROWTH_LOOP_PAT secret is missing. That means pull
            requests opened by the build job will not trigger the
            test-and-publish job, so nothing will ever be tested or merged
            and the loop will stall while still appearing to run. Make this
            the first, top item in reports/HUMAN-INBOX.md, worded as a
            two-minute fix: create a fine-grained personal access token
            scoped to this repository with Contents, Pull requests and
            Issues set to read/write, and save it as the GROWTH_LOOP_PAT
            repository secret. Continue the rest of this run regardless.
            Then read seo-config.yml at the repo root.

            Before the planner runs, and only if reports/PUBLISH-LOG.md shows
            this loop has published at least one page, run two review agents
            via the Task tool so the planner sequences against evidence rather
            than assumption:
            (a) seo-content-performance, which pulls per-page Search Console
            data for every published page, classifies each by age band and
            failure mode, and writes reports/CONTENT-SCORECARD.md plus
            reports/WRITING-LESSONS.md. The lessons file is what seo-writer
            reads before drafting, so this is the step that makes the content
            actually improve cycle over cycle rather than just continuing.
            (b) seo-internal-links, which builds the whole-site link graph with
            `claude-seo run link_graph.py` and writes reports/LINK-GRAPH.md
            with orphans first. Run this every cycle once the site passes about
            20 pages, and monthly below that; a small site's graph does not
            change enough weekly to be worth the minutes.
            Both append their proposed work to the roadmap for the planner to
            sequence. Neither edits any page.

            Then invoke seo-planner and WAIT for it to finish in this
            same turn, confirming with Read or ls that reports/ROADMAP.md,
            reports/CONTENT-CALENDAR.md, reports/KPI-TRACKER.md, and
            reports/HUMAN-INBOX.md now exist and are non-empty before you
            proceed, using the most recent audit if one exists. Then run a full /seo audit
            against site.url from seo-config.yml. Commit reports/ directly
            to the default branch with message "chore(seo): weekly plan +
            audit". Do not touch any file outside reports/. Finally, sync
            reports/HUMAN-INBOX.md to a single pinned GitHub issue titled
            "Growth Loop: needs your input". Search open issues for that
            exact title first. If it does not exist, create it with `gh
            issue create --assignee ${{ github.repository_owner }}` — the
            assignment is what makes GitHub email the owner. If it does
            exist, overwrite its body with `gh issue edit --body-file` so
            it always reflects the current queue, and confirm the owner is
            still assigned.
            Editing an issue body sends NO notification to anyone. So
            whenever this run adds an item marked NOTIFY that was not in
            the previous body, you must also post a comment with `gh issue
            comment` that names the new item and @-mentions
            ${{ github.repository_owner }}. A comment with a mention
            notifies regardless of the owner's repo-watch settings; a
            silent body edit does not. Without this, a blocker raised in
            week three sits unread for months. Post at most one comment
            per run, summarising all new items together, and post none at
            all when nothing was added — this channel only stays useful if
            it stays quiet.
            The issue is informational, never a blocker — say so in the
            body. If the queue is empty, say so plainly rather than
            leaving stale items. If anything in this run fails, errors, or cannot be completed, do not stop and do not report a bare failure: invoke the seo-resolver agent with the literal error and let it run its full seven-rung ladder. Read reports/RESOLUTIONS.md first so a known fix is reapplied rather than rediscovered, and append any new resolution to it.
            DEFINITION OF DONE. This job has not finished until all of these
            exist in the repository and are committed to the default branch:
            reports/ROADMAP.md, reports/KPI-TRACKER.md,
            reports/HUMAN-INBOX.md, and reports/AUDIT.md holding the audit
            findings. Before you finish, run `git log --oneline -1` and
            `ls reports/` and confirm your commit is there. A run that ends
            without them has failed even if nothing errored, and the very
            next step is seo-resolver, not a summary.
          claude_args: |
            --max-turns 60
            --allowedTools "Bash,Read,Write,Glob,Grep,Task"

      - name: Verify the audit actually produced its reports
        # The agent can finish cleanly, with no error and no permission denial,
        # having written nothing. That reported success and looked like a
        # working loop, which is worse than a failure because it hides. Check
        # the artifacts rather than the exit code.
        run: |
          set -uo pipefail
          git pull --quiet origin "${GITHUB_REF_NAME}" 2>/dev/null || true
          MISSING=""
          for f in reports/ROADMAP.md reports/KPI-TRACKER.md reports/HUMAN-INBOX.md; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::The agent completed without producing:$MISSING. A run that writes nothing has failed, whatever it reported. Check the job log for what it did with its turns."
            exit 1
          fi
          echo "Audit produced its reports." >> "$GITHUB_STEP_SUMMARY"


      - name: Explain an agent failure that is really a token failure
        if: failure()
        run: |
          set -uo pipefail
          OUT="${RUNNER_TEMP}/claude-execution-output.json"
          # A rejected token does not surface as an auth error. The action
          # installs, initialises, then returns is_error with no model call:
          # zero cost and an empty modelUsage. Without this step the operator
          # sees only "Claude execution failed" and reasonably starts debugging
          # the prompt or the plugin, neither of which is at fault.
          if [ -f "$OUT" ] && grep -q '"total_cost_usd": *0' "$OUT" 2>/dev/null \
                           && grep -q '"modelUsage": *{}' "$OUT" 2>/dev/null; then
            echo "::error::The agent never made a model call: total_cost_usd 0 and modelUsage empty. This is almost always a CLAUDE_CODE_OAUTH_TOKEN that is set but no longer valid, NOT a problem with the prompt, the plugin or this workflow. Confirm with the 'Claude token check' workflow in this repo, then run 'claude setup-token' locally and update the secret."
            {
              echo "## This looks like a token failure, not a loop failure"
              echo ""
              echo "The agent initialised and then made no model call at all."
              echo "Run the **Claude token check** workflow to confirm, then"
              echo "regenerate with \`claude setup-token\` and update the"
              echo "CLAUDE_CODE_OAUTH_TOKEN secret."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
  # ---- Tue/Thu: fixer + content agents, opens a PR. Never pushes to main directly. ----
  build:
    needs: preflight
    if: github.event.schedule == '0 6 * * 2,4' || inputs.job == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
      - name: Install the plugin's Python runtime
        # The plugin's bundled scripts are what an audit actually runs, and they
        # need their dependencies present. claude-code-action installs the
        # plugin's files but not a Python environment for them, and a fresh
        # runner has neither, so every `claude-seo run ...` call fails and the
        # agent burns its turns discovering that. Install the pinned release's
        # requirements up front, and make the scripts importable directly so a
        # missing launcher shim is not fatal.
        run: |
          set -uo pipefail
          TAG="v1.6.0"
          curl -fsSL -o "${RUNNER_TEMP}/requirements.txt" \
            "https://raw.githubusercontent.com/jishhnnuu/seo-aeo-geo/${TAG}/requirements.txt" || true
          if [ -s "${RUNNER_TEMP}/requirements.txt" ]; then
            python3 -m pip install --quiet -r "${RUNNER_TEMP}/requirements.txt" \
              || echo "::warning::Some plugin dependencies failed to install. The audit will degrade to whatever still works rather than stopping."
          else
            echo "::warning::Could not fetch the plugin requirements for ${TAG}. Bundled scripts may be unavailable this run."
          fi

      - name: Normalise the Claude token
        # A secret pasted with a stray leading or trailing space malforms the
        # auth header. It fails in the least readable way possible: no auth
        # error, the action installs and initialises fine, then returns
        # is_error with zero cost and no model call. GitHub masks the token
        # itself but not the surrounding whitespace, so the giveaway is a value
        # rendering as " ***" in the action's input dump.
        #
        # Trim it, re-register the trimmed value as masked BEFORE it is used so
        # it can never surface in a log, and say loudly if trimming changed
        # anything so the secret gets fixed at source rather than papered over.
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          TRIMMED="$(printf '%s' "$RAW" | tr -d '[:space:]')"
          echo "::add-mask::$TRIMMED"
          echo "CLAUDE_TOKEN=$TRIMMED" >> "$GITHUB_ENV"
          if [ "${#TRIMMED}" -ne "${#RAW}" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN contained $(( ${#RAW} - ${#TRIMMED} )) whitespace character(s), which have been stripped for this run. Re-paste the secret without them: Settings, Secrets and variables, Actions."
          fi
          if [ -z "$TRIMMED" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or whitespace only."
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_TOKEN }}
          plugin_marketplaces: "https://github.com/jishhnnuu/seo-aeo-geo.git"
          plugins: "claude-seo-unified@jishnu-seo-aeo-geo"
          prompt: >
            THIS IS A ONE-SHOT, NON-INTERACTIVE RUN. There is no later turn: when
            this job's steps finish, the container is gone. If you invoke a
            subagent, you must wait for it to actually complete and its files
            to actually exist on disk BEFORE you end your turn. Never launch a
            subagent asynchronously and end your turn assuming you will be
            "notified when it finishes" or resumed afterward. That behaviour is
            for an interactive session; here it means the subagent runs into
            the void and nothing after it ever executes. If your subagent tool
            offers a background or async mode, do not use it in this workflow.
            Confirm completion the same way a human would: check that the
            files the subagent was supposed to write are actually present with
            Read or ls before moving on or finishing.
