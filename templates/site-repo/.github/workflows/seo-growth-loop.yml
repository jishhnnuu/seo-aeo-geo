# Autonomous SEO/AEO/GEO growth loop for this website.
#
# Runs the claude-seo-unified plugin (planner -> audit -> fix/content ->
# test -> publish -> distribute) on a schedule, using YOUR Claude
# subscription (via CLAUDE_CODE_OAUTH_TOKEN) rather than a separate,
# pay-per-token API key. See docs/GROWTH-LOOP.md for the full setup guide.
#
# BEFORE FIRST RUN:
#   1. Fill in seo-config.yml at the repo root.
#   2. Set the secrets listed under "env:" below. Every one is optional
#      except the two marked REQUIRED: the loop degrades to weaker data
#      rather than failing when a credential is absent.
#
#      REQUIRED:
#        CLAUDE_CODE_OAUTH_TOKEN  - from `/install-github-app` in Claude Code.
#        GROWTH_LOOP_PAT          - see "Why a PAT is required" below.
#
#      On a GitHub *organization*, the shared ones (CLAUDE_CODE_OAUTH_TOKEN,
#      GROWTH_LOOP_PAT, GOOGLE_API_KEY, GOOGLE_APPLICATION_CREDENTIALS_JSON,
#      MOZ_API_KEY, BING_WEBMASTER_API_KEY) can be organization secrets that
#      every site repo inherits. On a *personal* account there is no such
#      thing as an account-level Actions secret, so set them per repo.
#      (Organization secrets on PRIVATE repos additionally need a Team plan;
#      on public repos they work on Free.)
#   3. Turn on branch protection on your deploy branch requiring the
#      "test-and-publish" status check to pass before merge
#      (belt-and-suspenders alongside seo-publisher's own precondition).
#
# ---------------------------------------------------------------------------
# WHY A PAT IS REQUIRED (do not skip this)
#
# GitHub deliberately does not start a workflow run from an event created
# with the built-in GITHUB_TOKEN -- it is how they prevent workflows from
# triggering themselves forever. The "build" job below opens a pull request,
# and "test-and-publish" runs `on: pull_request`. If the PR is opened with
# GITHUB_TOKEN, that second job NEVER RUNS: the PR sits open, nothing tests
# it, nothing merges it, and the loop silently stalls every cycle while
# appearing to work.
#
# So: create a fine-grained personal access token scoped to THIS repository
# with Contents: read/write, Pull requests: read/write, Issues: read/write,
# and save it as the GROWTH_LOOP_PAT secret. The jobs below fall back to
# GITHUB_TOKEN if it is absent, which keeps the audit jobs working but
# leaves publishing stalled -- the plan-and-audit job reports this.
#
# DEPLOYMENT: merging is not the same as deploying. Vercel, Netlify,
# Cloudflare Pages and similar hosts deploy from their own webhooks, which
# fire normally on any push. But if THIS repo deploys via another GitHub
# Actions workflow (GitHub Pages, a custom deploy.yml), that workflow is
# subject to the same restriction above -- it needs the PAT too, or it will
# not fire on the merge.
#
# COST: Actions minutes are unlimited on public repos but metered on private
# ones (2,000/month on Free, 3,000 on Pro). This loop runs roughly ten agent
# jobs a week. Every job below sets timeout-minutes so one hung run cannot
# eat the month; watch Settings -> Billing for the first few weeks.
#
# KEEPING THE SCHEDULE ALIVE: GitHub disables scheduled workflows in a repo
# with no activity for 60 days. This loop commits to reports/ weekly, which
# counts as activity, so it sustains itself as long as it is running.
# ---------------------------------------------------------------------------

name: SEO Growth Loop

on:
  schedule:
    - cron: "0 6 * * 1"        # plan + full audit: Monday 06:00 UTC
    - cron: "0 6 * * 2,4"      # fix + content build: Tuesday & Thursday 06:00 UTC
    - cron: "0 7 * * *"        # distribution + indexing check: daily 07:00 UTC
  pull_request:
    branches: [seo/**]
    types: [opened, synchronize, reopened]
  workflow_dispatch:           # lets you trigger one job manually from the Actions tab
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: plan-and-audit
        type: choice
        options: [plan-and-audit, build, distribute]

# Serialize runs that commit to the default branch, so the Monday audit and
# the daily distribute job can never race each other into a push conflict.
# PR runs get their own group so testing is never blocked by an audit.
concurrency:
  group: >-
    seo-growth-loop-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number) || 'default-branch' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Every bundled script in the plugin reads its credentials from these exact
# environment variables (with a config-file fallback we don't need on an
# ephemeral runner). Declared once at workflow level so all four jobs
# inherit them — nothing is written to disk.
env:
  # --- SHARED across all your sites: set as ORGANIZATION secrets ---
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}                                    # Tier 0: PageSpeed Insights, CrUX, CrUX History
  GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}  # Tier 1: Search Console + Indexing API (paste the service-account JSON inline)
  MOZ_API_KEY: ${{ secrets.MOZ_API_KEY }}                                          # free-tier backlink data
  BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}                    # Bing Webmaster Tools
  # --- PER-SITE: set as secrets on THIS repo ---
  GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}                                        # e.g. sc-domain:example.com
  GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}                                  # Tier 2: GA4 organic traffic
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}                                        # per-site host key
  INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}                      # optional, if the key file isn't at the site root
  # --- PER-SITE CMS credentials: only the ones your platform needs ---
  WP_APP_USER: ${{ secrets.WP_APP_USER }}
  WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
  SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
  WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
  # --- lets the agents use the `gh` CLI (issue sync, PR creation) ---
  # Prefer the PAT: a pull request opened with the built-in GITHUB_TOKEN does
  # not trigger the `on: pull_request` test-and-publish job. See the header.
  GH_TOKEN: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
  HAS_GROWTH_LOOP_PAT: ${{ secrets.GROWTH_LOOP_PAT != '' }}

jobs:
  # ---- Runs first on every trigger. Proves the setup still works before any
  #      other job spends 45 minutes and your Actions minutes on it. ----
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}

      - name: Prove every credential with a real call
        id: check
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          MOZ_API_KEY: ${{ secrets.MOZ_API_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          HAS_PAT: ${{ secrets.GROWTH_LOOP_PAT != '' }}
        run: |
          set -uo pipefail
          python3 -m pip install --quiet pyyaml google-auth google-api-python-client 2>/dev/null || true
          python3 scripts/preflight_check.py --github-summary >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fail loudly if the loop cannot do its job at all
        run: |
          set -euo pipefail
          python3 scripts/preflight_check.py --gate

  # ---- Monday: strategy + full audit. Writes reports/ only, no site changes. ----
  plan-and-audit:
    needs: preflight
    if: github.event.schedule == '0 6 * * 1' || inputs.job == 'plan-and-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/jishhnnuu/seo-aeo-geo.git"
          plugins: "claude-seo-unified@jishnu-seo-aeo-geo"
          prompt: >
            First: if the environment variable HAS_GROWTH_LOOP_PAT is not
            "true", the GROWTH_LOOP_PAT secret is missing. That means pull
            requests opened by the build job will not trigger the
            test-and-publish job, so nothing will ever be tested or merged
            and the loop will stall while still appearing to run. Make this
            the first, top item in reports/HUMAN-INBOX.md, worded as a
            two-minute fix: create a fine-grained personal access token
            scoped to this repository with Contents, Pull requests and
            Issues set to read/write, and save it as the GROWTH_LOOP_PAT
            repository secret. Continue the rest of this run regardless.
            Then read seo-config.yml at the repo root. Run the seo-planner agent
            to refresh reports/ROADMAP.md, reports/CONTENT-CALENDAR.md,
            reports/KPI-TRACKER.md, and reports/HUMAN-INBOX.md, using the
            most recent audit if one exists. Then run a full /seo audit
            against site.url from seo-config.yml. Commit reports/ directly
            to the default branch with message "chore(seo): weekly plan +
            audit". Do not touch any file outside reports/. Finally, sync
            reports/HUMAN-INBOX.md to a single pinned GitHub issue titled
            "Growth Loop: needs your input". Search open issues for that
            exact title first. If it does not exist, create it with `gh
            issue create --assignee ${{ github.repository_owner }}` — the
            assignment is what makes GitHub email the owner. If it does
            exist, overwrite its body with `gh issue edit --body-file` so
            it always reflects the current queue, and confirm the owner is
            still assigned.
            Editing an issue body sends NO notification to anyone. So
            whenever this run adds an item marked NOTIFY that was not in
            the previous body, you must also post a comment with `gh issue
            comment` that names the new item and @-mentions
            ${{ github.repository_owner }}. A comment with a mention
            notifies regardless of the owner's repo-watch settings; a
            silent body edit does not. Without this, a blocker raised in
            week three sits unread for months. Post at most one comment
            per run, summarising all new items together, and post none at
            all when nothing was added — this channel only stays useful if
            it stays quiet.
            The issue is informational, never a blocker — say so in the
            body. If the queue is empty, say so plainly rather than
            leaving stale items. If anything in this run fails, errors, or cannot be completed, do not stop and do not report a bare failure: invoke the seo-resolver agent with the literal error and let it run its full seven-rung ladder. Read reports/RESOLUTIONS.md first so a known fix is reapplied rather than rediscovered, and append any new resolution to it.
          claude_args: |
            --allowedTools "Bash,Read,Write,Glob,Grep,Task"

  # ---- Tue/Thu: fixer + content agents, opens a PR. Never pushes to main directly. ----
  build:
    needs: preflight
    if: github.event.schedule == '0 6 * * 2,4' || inputs.job == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/jishhnnuu/seo-aeo-geo.git"
          plugins: "claude-seo-unified@jishnu-seo-aeo-geo"
          prompt: >
            First, preflight: confirm every credential this run needs
            actually works, by making a real call with each rather than
            checking that a file or env var exists — GOOGLE_API_KEY against
            PageSpeed Insights, the service account against Search Console
            sites.list for this property, GA4 if configured. Record the
            result in reports/PREFLIGHT.md. A credential that is present but
            unauthorized is a different problem from one that is absent;
            name which. Missing credentials degrade this run rather than
            stopping it — proceed with what works and state plainly in the
            run summary what data was unavailable and what it cost.
            Then read reports/ROADMAP.md's "This cycle" section. Before editing
            anything, establish the URL-to-source mapping for this repo:
            read site.framework / site.content_dir / site.output_dir from
            seo-config.yml, and if framework is "auto", detect it from the
            repo (package.json dependencies, astro.config.*, next.config.*,
            _config.yml, config.toml, .eleventy.js). Then, for each finding,
            locate the source file that actually produces the affected URL —
            confirm it by grepping the repo for the exact offending string
            (the current title text, meta description, or heading) rather
            than assuming a path convention. Never edit files under
            site.output_dir; that is generated output and your change would
            be overwritten by the next build. If you cannot confidently map
            a finding to a source file, do not skip it and do not guess —
            hand it to the seo-resolver agent, which will try the repo's
            build output, the rendered page's own markup, git history for
            the string, and framework-specific routing conventions before
            anything is set aside. Create a branch
            named seo/<date>-<short-slug>. For each AUTO-tier finding, run
            /seo fix with the diffs pre-approved by the fact that they are
            listed as AUTO-tier in the roadmap (seo-fixer-writer still
            re-verifies each one after applying it). For each content item
            on the roadmap, use the matching content brief to draft the
            page or post as a file in this repo. Run the seo-outreach agent
            against any off-page/citation items on the roadmap — it follows
            its own non-blocking rules and writes reports/OUTREACH-LOG.md
            and queues anything needing a human action to
            reports/HUMAN-INBOX.md rather than waiting. Commit everything
            to the branch and open a pull request against seo-config.yml's
            site.deploy_branch, describing exactly what changed and why,
            with a link to the roadmap items it addresses. Do not merge it
            yourself. If anything in this run fails, errors, or cannot be completed, do not stop and do not report a bare failure: invoke the seo-resolver agent with the literal error and let it run its full seven-rung ladder. Read reports/RESOLUTIONS.md first so a known fix is reapplied rather than rediscovered, and append any new resolution to it.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task"

  # ---- Any PR opened by the build job: test, then publish only if it passes. ----
  test-and-publish:
    needs: preflight
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/jishhnnuu/seo-aeo-geo.git"
          plugins: "claude-seo-unified@jishnu-seo-aeo-geo"
          prompt: >
            Run the seo-tester agent's full pre-publish gate against this
            branch's changes. If seo-config.yml sets site.netlify_site_name,
            the host has already built this PR — poll
            https://deploy-preview-${{ github.event.pull_request.number }}--<netlify_site_name>.netlify.app
            until it returns 200 (up to ~5 minutes) and audit that rendered
            preview rather than the source files, per Phase 1 step 0 of the
            agent. Write reports/TEST-REPORT.md with VERDICT:
            PASS or VERDICT: FAIL as its first line, and state which surface
            you actually tested (deploy preview URL, or local build output,
            or source only). If seo-config.yml's
            autonomy.mode is "gated" (the default) and the verdict is PASS,
            run the seo-publisher agent to merge and publish. If the
            verdict is FAIL, comment the report on this pull request and do
            not merge. If autonomy.mode is "ungated", run seo-publisher
            regardless of the verdict but still write the report first. If anything in this run fails, errors, or cannot be completed, do not stop and do not report a bare failure: invoke the seo-resolver agent with the literal error and let it run its full seven-rung ladder. Read reports/RESOLUTIONS.md first so a known fix is reapplied rather than rediscovered, and append any new resolution to it.
          claude_args: |
            --allowedTools "Bash,Read,Write,Glob,Grep,Task,mcp__github_inline_comment__create_inline_comment"
            --comment

  # ---- Daily: ping IndexNow / Search Console for anything newly live, check for regressions. ----
  distribute:
    needs: preflight
    if: github.event.schedule == '0 7 * * *' || inputs.job == 'distribute'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GROWTH_LOOP_PAT || github.token }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/jishhnnuu/seo-aeo-geo.git"
          plugins: "claude-seo-unified@jishnu-seo-aeo-geo"
          prompt: >
            Read reports/PUBLISH-LOG.md for anything published since the
            last distribute run. For each new/changed URL, confirm IndexNow
            and (if Google credentials are configured) Search Console
            indexing requests already ran; if not, run them now. Run the
            seo-tester agent's Phase 2 post-publish verification for those
            URLs. Append a dated entry to reports/DISTRIBUTION-LOG.md
            summarizing what was submitted and any anomalies found. Commit
            directly to the default branch. If anything in this run fails, errors, or cannot be completed, do not stop and do not report a bare failure: invoke the seo-resolver agent with the literal error and let it run its full seven-rung ladder. Read reports/RESOLUTIONS.md first so a known fix is reapplied rather than rediscovered, and append any new resolution to it.
          claude_args: |
            --allowedTools "Bash,Read,Write,Glob,Grep,Task"
